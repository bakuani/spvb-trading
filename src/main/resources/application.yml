spring:
  application:
    name: spvb-trading
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/trading}
    username: ${DB_USER:trading}
    password: ${DB_PASSWORD:trading}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 10000
      data-source-properties:
        options: -c lock_timeout=10s
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: ${PORT:8080}
  error:
    include-message: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
