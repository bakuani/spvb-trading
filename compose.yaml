name: spvb-trading

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - trading-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/trading
      DB_USER: trading
      DB_PASSWORD: trading
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  trading-data:
